<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корзина — КРЕПОЛИТ</title>
<meta name="description" content="Корзина интернет-магазина крепежа и метизов КРЕПОЛИТ. Оформление оптового и розничного заказа.">
<meta name="theme-color" content="#0f1b2d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="crumb"><div class="wrap"><a href="index.html">Главная</a><span class="sep">/</span><b>Корзина</b></div></div>
<div class="wrap page-head"><h1>Корзина</h1></div>

<section style="padding-top:22px"><div class="wrap" id="cart-root"></div></section>

<script src="assets/products.js"></script>
<script src="assets/app.js"></script>
<script>
initChrome();
const root = document.getElementById('cart-root');

function render(){
  const items = Object.entries(CART);
  if(!items.length){
    root.innerHTML = `<div class="cart-empty" style="background:#fff;border:1px solid var(--line);border-radius:16px">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6h15l-1.5 9h-12L6 6zM6 6l-.7-3H2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.6" fill="currentColor"/><circle cx="18" cy="20" r="1.6" fill="currentColor"/></svg>
      <h2 style="color:var(--ink);margin:0 0 8px">Корзина пуста</h2>
      <p style="margin:0 0 20px">Добавьте товары из каталога, чтобы оформить заказ.</p>
      <a class="btn btn-accent btn-lg" href="catalog.html">Перейти в каталог</a></div>`;
    return;
  }
  const rows = items.map(([id,q])=>{const p=PBYID[id];if(!p)return'';return `
    <div class="cart-row">
      <a class="cr-img" href="product.html?id=${id}"><svg viewBox="0 0 48 48"><use href="#${CICON[p.cat]}"/></svg>${pimgHtml(p)}</a>
      <div class="cr-name"><b><a href="product.html?id=${id}">${p.name}</a></b><span>Арт. ${p.art}</span></div>
      <div class="cr-price">${fmt(p.price)} ₽/${p.unit}</div>
      <div class="qty"><button data-q="${id}:-1">−</button><span>${q}</span><button data-q="${id}:1">+</button></div>
      <div class="cr-sum">${fmt(p.price*q)} ₽</div>
      <button class="cr-del" data-del="${id}" aria-label="Удалить">✕</button>
    </div>`;}).join('');
  const total = cartTotal(), delivery = total>=30000?0:490;
  root.innerHTML = `
    <div class="cart-wrap">
      <div class="cart-list">${rows}</div>
      <div class="summary">
        <h3>Ваш заказ</h3>
        <div class="srow"><span>Товары (${cartCount()} шт.)</span><span>${fmt(total)} ₽</span></div>
        <div class="srow"><span>Доставка по Москве</span><span>${delivery?fmt(delivery)+' ₽':'бесплатно'}</span></div>
        <div class="stotal"><span>Итого</span><span>${fmt(total+delivery)} ₽</span></div>
        <form data-form="Оформление заказа">
          <input type="text" placeholder="Ваше имя" required style="width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:10px;font-size:15px;outline:none;font-family:inherit">
          <input type="tel" placeholder="Телефон" required style="width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:10px;font-size:15px;outline:none;font-family:inherit">
          <input type="email" placeholder="E-mail" required style="width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:10px;font-size:15px;outline:none;font-family:inherit">
          <input type="text" placeholder="Организация (необязательно)" style="width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:14px;font-size:15px;outline:none;font-family:inherit">
          <button class="btn btn-accent">Оформить заказ</button>
        </form>
        <p style="font-size:12px;color:var(--muted);margin:12px 0 0">Менеджер свяжется для подтверждения заказа и уточнения способа доставки.</p>
      </div>
    </div>`;
}
render();
window.PAGE_REFRESH = render;
</script>
</body>
</html>
