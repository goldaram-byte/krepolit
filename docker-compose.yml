services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_PATH=/app/data/krepolit.db
      - JWT_SECRET=${JWT_SECRET:?Задайте JWT_SECRET в .env}
    volumes:
      - crm_data:/app/data          # база SQLite
      - crm_uploads:/app/uploads    # загруженные фото товаров
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      - DOMAIN=${DOMAIN:-:80}       # свой домен -> авто-HTTPS; пусто -> :80 по IP
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  crm_data:
  crm_uploads:
  caddy_data:
  caddy_config:
