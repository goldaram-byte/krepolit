# krepolit — конфиг для существующего nginx. Кладётся в /etc/nginx/sites-available/krepolit
# и линкуется в sites-enabled. Проксирует на приложение (127.0.0.1:3000).
# SSL добавит certbot: certbot --nginx -d krepolit.ru -d www.krepolit.ru -d krepolit.online -d www.krepolit.online

# krepolit.ru — публичная витрина
server {
    listen 80;
    listen [::]:80;
    server_name krepolit.ru www.krepolit.ru;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# krepolit.online — админка (корень редиректит на /admin)
server {
    listen 80;
    listen [::]:80;
    server_name krepolit.online www.krepolit.online;

    client_max_body_size 25m;

    location = / { return 302 /admin; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
